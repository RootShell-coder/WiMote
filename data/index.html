<!DOCTYPE html>
<html>
<head>
    <title>IR Remote Control</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
    <div class="container">
        <div class="remote">
            <div class="button-grid">
                <button class="remote-button power" data-command="POWER">Power</button>
                <button class="remote-button" onclick="location.href='/config.html'">Config</button>
                <button class="remote-button" onclick="location.href='/ir_editor.html'">
                    <i class="fas fa-edit"></i> Edit IR
                </button>
            </div>

            <div class="remote-title">WiMote IR</div>

            <div class="channel-pad">
                <button class="remote-button" data-command="1">1</button>
                <button class="remote-button" data-command="2">2</button>
                <button class="remote-button" data-command="3">3</button>
                <button class="remote-button" data-command="4">4</button>
                <button class="remote-button" data-command="5">5</button>
                <button class="remote-button" data-command="6">6</button>
                <button class="remote-button" data-command="7">7</button>
                <button class="remote-button" data-command="8">8</button>
                <button class="remote-button" data-command="9">9</button>
                <button class="remote-button" data-command="BACK">←</button>
                <button class="remote-button" data-command="0">0</button>
                <button class="remote-button" data-command="ENTER">↵</button>
            </div>

            <div class="control-section">
                <div class="control-column">
                    <button class="remote-button" data-command="CH_UP">Ch ▲</button>
                    <button class="remote-button" data-command="CH_DOWN">Ch ▼</button>
                </div>
                <div class="control-column">
                    <button class="remote-button" data-command="MENU">Menu</button>
                    <button class="remote-button" data-command="MUTE">Mute</button>
                </div>
                <div class="control-column">
                    <button class="remote-button" data-command="VOL_UP">Vol ▲</button>
                    <button class="remote-button" data-command="VOL_DOWN">Vol ▼</button>
                </div>
            </div>

            <div id="status" class="status"></div>
        </div>
    </div>
    <script type="module" src="remote.js"></script>
</body>
</html>
